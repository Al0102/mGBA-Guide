site_name: Setting Up MGBA, A Gameboy Advance Emulator
site_url: https://al0102.github.io/mGBA-Guide/
theme:
  name: material
  font:
    text: Merryweather Sans
    code: Red Hat Mono
  icon:
    logo: fontawesome/solid/gamepad
    favicon: assets/favcion.ico
  palette:
    # Auto mode
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/weather-night
        name: To Dark Mode

    # Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: orange
      toggle:
        icon: material/weather-sunny
        name: To Light Mode

    # Light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default 
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/eye
        name: To Auto Mode
  features:
    - navigation.footer

markdown_extensions:
  # Emojis
  - attr_list
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
      options:
        custom_icons:
          - overrides/.icons
  # Annotations
  - admonition
  - pymdownx.details
  # Code blocks
  # Code blocks syntax highlighting
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  # Code block tabs
  - pymdownx.tabbed:
      alternate_style: true


# Footer
#   extra:
#     social:
# Add stuff here
